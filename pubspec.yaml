name: personal_finance_manager
description: Offline-first personal finance and multi-asset manager (Android, Flutter).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  decimal: ^3.0.2
  uuid: ^4.5.0
  intl: ^0.19.0
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  local_auth: ^3.0.2
  fl_chart: ^1.2.0
  csv: ^8.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true
